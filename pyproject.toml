[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frmony"
version = "0.1.0"
description = "Ab-initio subtomogram averaging by rotational matching and orthogonal group synchronization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Oier Lauzirika Zarrabeitia", email = "oierlauzi@bizkaia.eu" },
]
requires-python = ">=3.12"
keywords = ["cryo-ET", "subtomogram averaging", "cryo-EM", "tomography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4.35",
    "mrcfile>=1.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "starfile>=0.5.2",
    "tqdm>=4.66",
    "vitrio>=0.2",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]
dev = [
    "mypy>=1.11",
    "pandas-stubs",
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.9",
    "scipy-stubs",
    "types-tqdm",
]

[project.scripts]
frmony = "frmony.cli:main"

[project.urls]
Repository = "https://github.com/oierlauzi/frmony"
Issues = "https://github.com/oierlauzi/frmony/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frmony"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs the whole pipeline on simulated subtomograms",
]

[tool.coverage.run]
source = ["frmony"]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplifications
    "NPY",     # numpy
    "RUF",
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["starfile.*", "vitrio.*", "mrcfile.*"]
ignore_missing_imports = true
